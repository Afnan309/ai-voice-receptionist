<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AI Receptionist{% endblock %}</title>
<style>
  :root{--bg:#f6f8f7;--panel:#fff;--ink:#0f1f1a;--muted:#64748b;--line:#e2e8e5;--brand:#059669;--brand-d:#047857;--soft:#d1fae5;
        --red:#b91c1c;--red-soft:#fee2e2;--amber:#b45309;--amber-soft:#fef3c7;--blue:#1d4ed8;--blue-soft:#dbeafe;--gray:#f1f5f9}
  *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  .top{display:flex;align-items:center;gap:24px;padding:14px 28px;background:#0f1f1a;color:#fff}
  .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}.logo i{width:30px;height:30px;border-radius:50%;background:var(--brand);display:grid;place-items:center;font-style:normal;font-size:15px}
  .top a{color:#cbd5e1;text-decoration:none;font-weight:500}.top a.on{color:#fff}
  .top .live{margin-left:auto;font-size:12px;color:#a7f3d0;display:flex;align-items:center;gap:8px}.top .live b{width:8px;height:8px;border-radius:50%;background:#34d399}
  .wrap{padding:24px 28px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
  h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
  .badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;display:inline-block;white-space:nowrap}
  .o-booked{background:var(--soft);color:var(--brand-d)}.o-emergency_booked{background:var(--amber-soft);color:var(--amber)}
  .o-escalated{background:var(--red-soft);color:var(--red)}.o-faq_answered,.o-transferred{background:var(--blue-soft);color:var(--blue)}
  .o-out_of_area,.o-not_served,.o-incomplete,.o-cancelled{background:var(--gray);color:var(--muted)}
  .muted{color:var(--muted)}.mono{font-family:'DejaVu Sans Mono',monospace;font-size:12px}
</style>
{% block head %}{% endblock %}
</head>
<body>
<div class="top"><div class="logo"><i>☎</i>{{ biz.name }} · AI Receptionist</div>
  <a href="/" class="{{ 'on' if request.path=='/' or request.path.startswith('/call') }}">Calls</a>
  <a href="/schedule" class="{{ 'on' if request.path=='/schedule' }}">Schedule</a>
  <a href="/simulator" class="{{ 'on' if request.path=='/simulator' }}">Test a call</a>
  <span class="live"><b></b>Ava is answering · 24/7</span></div>
<div class="wrap">{% block body %}{% endblock %}</div>
</body>
</html>
